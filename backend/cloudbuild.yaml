# Build the API image and deploy it to Cloud Run. Run from the repo root:
#   gcloud builds submit --config backend/cloudbuild.yaml .
# One-time setup is in docs/setup.md (Artifact Registry repo, the DATABASE_URL secret,
# and backend/cloudrun.env.yaml).
substitutions:
  _REGION: us-east4  # Northern Virginia, next to Supabase's us-east-1
  _SERVICE: nexlearn-api
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/nexlearn/api:${BUILD_ID}

options:
  dynamicSubstitutions: true  # lets _IMAGE use _REGION and the built-ins
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "backend/Dockerfile", "-t", "${_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --allow-unauthenticated  # the API checks Supabase tokens itself
      - --set-secrets=DATABASE_URL=nexlearn-database-url:latest,OPENAI_API_KEY=nexlearn-openai-key:latest
      - --env-vars-file=backend/cloudrun.env.yaml
      - --min-instances=0
      - --max-instances=3

images: ["${_IMAGE}"]
