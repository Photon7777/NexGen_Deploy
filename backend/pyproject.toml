[project]
name = "nexlearn-api"
version = "2.0.0"
description = "NexLearn v2 API: FastAPI over Supabase Postgres"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary,pool]",
    "pyjwt[crypto]",
    "pydantic-settings",
    "pandas",
    "langchain==0.3.27",
    "langchain-core==0.3.79",
    "langchain-openai==0.3.35",
    "openai==2.7.1",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "pypdf>=6.20.1",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv]
# Only resolve releases at least two weeks old.
exclude-newer = "2026-10-14T00:00:00Z"

[tool.pytest.ini_options]
# The shared nexlearn package lives at the repo root until the Streamlit app is retired.
pythonpath = [".", ".."]
testpaths = ["tests"]
